name: CI

# The same three commands a contributor runs locally. The regression suite (golden frames) is not here: it needs the pinned
# Chrome that `npx visotalk@latest doctor --fix` installs, which is a 1 GB download.
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc
      - run: pnpm test
      - run: pnpm build
