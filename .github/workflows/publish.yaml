name: Publish

# A tag `v<version>` stages that version of the `visotalk` package on npm. The workflow holds no npm token: npm trusts this
# repository and this file by OpenID Connect (npm, package settings, "Trusted Publisher"), so what it can do is what npm allows
# it. It only stages; the release goes out when a maintainer approves the staged version with 2FA (`npm stage approve <id>`).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc
      - run: pnpm test
      - name: The tag names the version being published
        run: test "v$(node -p "require('./packages/cli/package.json').version")" = "$GITHUB_REF_NAME"
      # `prepack` builds the bundle
      - run: npm stage publish .
        working-directory: packages/cli
